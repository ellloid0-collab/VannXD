name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter (direct file URL)
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip

          # Jangan kirim Accept octet-stream kecuali api.github.com
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip \
              -H "User-Agent: VannXD-Build/1.0" \
              "$ZIP_URL"
          fi

          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then
            echo "File terlalu kecil — kemungkinan HTML/error page"
            head -c 400 project.zip || true
            exit 1
          fi
          # ZIP magic PK
          if ! head -c 2 project.zip | grep -q "PK"; then
            echo "Bukan file ZIP valid (magic header salah)"
            file project.zip || true
            head -c 200 project.zip || true
            exit 1
          fi

          mkdir -p project
          unzip -q project.zip -d project
          ROOT=$(find project -name "pubspec.yaml" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "pubspec.yaml tidak ditemukan di ZIP"
            find project -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
