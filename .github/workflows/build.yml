name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          test "$SIZE" -ge 1000
          head -c 2 project.zip | grep -q "PK"
          mkdir -p project
          unzip -q project.zip -d project
          PUBSPEC=$(find project -name "pubspec.yaml" -print -quit)
          test -n "$PUBSPEC"
          ROOT=$(dirname "$PUBSPEC")
          test -n "$ROOT"
          {
            echo "PROJECT_ROOT<<EOF"
            echo "$ROOT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Patch Android + pubspec
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          echo "ROOT=$ROOT"
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' "$PROP"
            cat "$PROP"
          fi
          python3 - "$ROOT" <<'PY'
          import sys, re
          from pathlib import Path
          root = Path(sys.argv[1])
          android = root / "android"
          if android.exists():
              for path in list(android.rglob("*.gradle")) + list(android.rglob("*.gradle.kts")):
                  if not path.is_file():
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  orig = text
                  text = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.11.1", text)
                  text = re.sub(r"(id\(['\"]com\.android\.application['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"8.11.1"', text)
                  text = re.sub(r"(id\(['\"]com\.android\.library['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"8.11.1"', text)
                  text = re.sub(r"(id\(['\"]org\.jetbrains\.kotlin\.android['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
                  text = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20", text)
                  text = re.sub(r"(ext\.kotlin_version\s*=\s*)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
                  text = re.sub(r"(kotlin_version\s*=\s*)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
                  if text != orig:
                      path.write_text(text, encoding="utf-8")
                      print("patched", path)
          pub = root / "pubspec.yaml"
          if pub.exists():
              text = pub.read_text(encoding="utf-8", errors="ignore")
              # longgarkan constraint FA; biarkan resolver pilih
              text = re.sub(r"font_awesome_flutter\s*:\s*[^\n]+", "font_awesome_flutter: any", text)
              pub.write_text(text, encoding="utf-8")
              print("pubspec updated")
          print("patch done")
          PY

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get

      - name: Nuclear fix font_awesome_flutter
        run: |
          set -euo pipefail
          python3 <<'PY'
          """
          Ganti seluruh package font_awesome_flutter di pub-cache dengan stub
          yang kompatibel Flutter modern (IconData final).
          Semua FontAwesomeIcons.* -> IconData Material fallback (tetap compile).
          FaIcon tetap ada.
          """
          import re, json
          from pathlib import Path

          cache = Path.home() / ".pub-cache"
          # cari root package (folder yang berisi pubspec name: font_awesome_flutter)
          roots = []
          for p in cache.rglob("pubspec.yaml"):
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if re.search(r"^name:\s*font_awesome_flutter\s*$", t, re.M):
                  roots.append(p.parent)
          print("FA roots:", roots)
          if not roots:
              print("font_awesome_flutter not installed — skip")
              raise SystemExit(0)

          # Ambil daftar nama icon dari file asli (sebelum dihapus)
          icon_names = set()
          for root in roots:
              for dart in root.rglob("*.dart"):
                  try:
                      txt = dart.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  for m in re.finditer(r"static\s+const\s+(?:IconData|FaIconData|FalconData|\w+)\s+(\w+)\s*=", txt):
                      icon_names.add(m.group(1))
                  for m in re.finditer(r"static\s+const\s+IconData\s+(\w+)\s*=", txt):
                      icon_names.add(m.group(1))
                  # pola FA 10/11: static const IconData xxx = IconDataYyy(0x..);
                  for m in re.finditer(r"static\s+const\s+\w+\s+(\w+)\s*=\s*IconData", txt):
                      icon_names.add(m.group(1))

          # filter nama tidak valid / reserved
          bad = {"IconData", "FaIcon", "FontAwesomeIcons", "index", "main", "toString", "hashCode", "runtimeType"}
          icon_names = sorted(n for n in icon_names if n.isidentifier() and n not in bad and not n.startswith("_"))
          print("icon count:", len(icon_names))

          # Jika gagal extract, sediakan set minimal biar project tetap compile
          if len(icon_names) < 10:
              icon_names = [
                  "home", "user", "users", "gear", "cog", "settings", "search", "heart", "star",
                  "check", "xmark", "plus", "minus", "bars", "ellipsis", "camera", "image",
                  "phone", "envelope", "bell", "comment", "comments", "share", "link", "globe",
                  "lock", "unlock", "eye", "eyeSlash", "download", "upload", "file", "folder",
                  "calendar", "clock", "map", "locationDot", "cartShopping", "creditCard",
                  "whatsapp", "telegram", "facebook", "instagram", "twitter", "youtube", "github",
                  "google", "apple", "android", "play", "pause", "stop", "forward", "backward",
                  "info", "warning", "circleExclamation", "circleCheck", "circleXmark", "trash",
                  "pen", "pencil", "copy", "clipboard", "list", "table", "filter", "sort",
                  "arrowLeft", "arrowRight", "arrowUp", "arrowDown", "chevronLeft", "chevronRight",
                  "chevronUp", "chevronDown", "angleLeft", "angleRight", "times", "close", "checkCircle",
              ]

          # Material icon mapping kasar untuk beberapa nama umum
          material_map = {
              "home": "Icons.home",
              "user": "Icons.person",
              "users": "Icons.people",
              "gear": "Icons.settings",
              "cog": "Icons.settings",
              "settings": "Icons.settings",
              "search": "Icons.search",
              "heart": "Icons.favorite",
              "star": "Icons.star",
              "check": "Icons.check",
              "xmark": "Icons.close",
              "times": "Icons.close",
              "close": "Icons.close",
              "plus": "Icons.add",
              "minus": "Icons.remove",
              "bars": "Icons.menu",
              "camera": "Icons.camera_alt",
              "image": "Icons.image",
              "phone": "Icons.phone",
              "envelope": "Icons.email",
              "bell": "Icons.notifications",
              "comment": "Icons.comment",
              "comments": "Icons.comments",
              "share": "Icons.share",
              "link": "Icons.link",
              "globe": "Icons.public",
              "lock": "Icons.lock",
              "unlock": "Icons.lock_open",
              "eye": "Icons.visibility",
              "eyeSlash": "Icons.visibility_off",
              "download": "Icons.download",
              "upload": "Icons.upload",
              "file": "Icons.insert_drive_file",
              "folder": "Icons.folder",
              "calendar": "Icons.calendar_today",
              "clock": "Icons.access_time",
              "map": "Icons.map",
              "locationDot": "Icons.location_on",
              "cartShopping": "Icons.shopping_cart",
              "creditCard": "Icons.credit_card",
              "trash": "Icons.delete",
              "pen": "Icons.edit",
              "pencil": "Icons.edit",
              "copy": "Icons.copy",
              "list": "Icons.list",
              "filter": "Icons.filter_list",
              "arrowLeft": "Icons.arrow_back",
              "arrowRight": "Icons.arrow_forward",
              "arrowUp": "Icons.arrow_upward",
              "arrowDown": "Icons.arrow_downward",
              "chevronLeft": "Icons.chevron_left",
              "chevronRight": "Icons.chevron_right",
              "chevronUp": "Icons.keyboard_arrow_up",
              "chevronDown": "Icons.keyboard_arrow_down",
              "info": "Icons.info",
              "warning": "Icons.warning",
              "play": "Icons.play_arrow",
              "pause": "Icons.pause",
              "stop": "Icons.stop",
              "whatsapp": "Icons.chat",
              "telegram": "Icons.send",
              "facebook": "Icons.facebook",
              "instagram": "Icons.camera",
              "twitter": "Icons.alternate_email",
              "youtube": "Icons.play_circle",
              "github": "Icons.code",
              "google": "Icons.g_mobiledata",
              "apple": "Icons.apple",
              "android": "Icons.android",
          }

          lines = []
          lines.append("library font_awesome_flutter;")
          lines.append("import 'package:flutter/material.dart';")
          lines.append("")
          lines.append("/// Stub compatible dengan Flutter modern (IconData final).")
          lines.append("class FaIcon extends StatelessWidget {")
          lines.append("  final IconData icon;")
          lines.append("  final double? size;")
          lines.append("  final Color? color;")
          lines.append("  final String? semanticLabel;")
          lines.append("  final TextDirection? textDirection;")
          lines.append("  const FaIcon(this.icon, {super.key, this.size, this.color, this.semanticLabel, this.textDirection});")
          lines.append("  @override")
          lines.append("  Widget build(BuildContext context) => Icon(icon, size: size, color: color, semanticLabel: semanticLabel, textDirection: textDirection);")
          lines.append("}")
          lines.append("")
          lines.append("class FontAwesomeIcons {")
          lines.append("  const FontAwesomeIcons._();")
          for name in icon_names:
              mapped = material_map.get(name, "Icons.circle")
              lines.append(f"  static const IconData {name} = {mapped};")
          lines.append("}")
          lines.append("")

          stub = "\n".join(lines)

          for root in roots:
              lib = root / "lib"
              # hapus semua dart lama, tulis stub tunggal
              if lib.exists():
                  for old in lib.rglob("*.dart"):
                      try:
                          old.unlink()
                      except Exception:
                          pass
              lib.mkdir(parents=True, exist_ok=True)
              (lib / "font_awesome_flutter.dart").write_text(stub, encoding="utf-8")
              # pastikan pubspec minimal
              (root / "pubspec.yaml").write_text(
                  "name: font_awesome_flutter\n"
                  "description: stub\n"
                  "version: 11.0.0\n"
                  "publish_to: none\n"
                  "environment:\n"
                  "  sdk: '>=3.0.0 <4.0.0'\n"
                  "dependencies:\n"
                  "  flutter:\n"
                  "    sdk: flutter\n",
                  encoding="utf-8",
              )
              print("stub installed at", root)

          print("nuclear FA fix done, icons=", len(icon_names))
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          # fallback cari apk di mana saja
          if [ -z "$(ls -A out/*.apk 2>/dev/null)" ]; then
            find "${{ env.PROJECT_ROOT }}" -name "*.apk" -print -exec cp {} out/ \;
          fi
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
