name: Flutter Zip2Apps Build

"on":
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          test "$SIZE" -ge 1000
          head -c 2 project.zip | grep -q "PK"
          mkdir -p project
          unzip -q project.zip -d project
          PUBSPEC=$(find project -name "pubspec.yaml" -print -quit)
          test -n "$PUBSPEC"
          ROOT=$(dirname "$PUBSPEC")
          {
            echo "PROJECT_ROOT<<EOF"
            echo "$ROOT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch Android toolchain
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|" "$PROP"
            cat "$PROP"
          fi
          python3 -c "
import re,sys
from pathlib import Path
root=Path(sys.argv[1]); android=root/'android'
if android.exists():
  for path in [p for p in list(android.rglob('*.gradle'))+list(android.rglob('*.gradle.kts')) if p.is_file()]:
    text=path.read_text(encoding='utf-8',errors='ignore'); orig=text
    text=re.sub(r'com\\.android\\.tools\\.build:gradle:[0-9.]+','com.android.tools.build:gradle:8.11.1',text)
    if text!=orig: path.write_text(text,encoding='utf-8'); print('patched',path)
print('android done')
" "$ROOT"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get

      - name: Replace font_awesome with stub
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path
          cache = Path.home() / '.pub-cache'
          roots = []
          for p in cache.rglob('pubspec.yaml'):
              try: t = p.read_text(encoding='utf-8', errors='ignore')
              except Exception: continue
              if re.search(r'^name:\s*font_awesome_flutter\s*$', t, re.M):
                  roots.append(p.parent)
          print('FA roots:', roots)
          if not roots:
              print('no FA'); raise SystemExit(0)
          icon_names = set()
          for root in roots:
              for dart in root.rglob('*.dart'):
                  try: txt = dart.read_text(encoding='utf-8', errors='ignore')
                  except Exception: continue
                  for m in re.finditer(r'static\s+const\s+\w+\s+(\w+)\s*=', txt):
                      icon_names.add(m.group(1))
          bad = {'IconData','FaIcon','FontAwesomeIcons','index','main','toString','hashCode','runtimeType'}
          icon_names = sorted(n for n in icon_names if n.isidentifier() and n not in bad and not n.startswith('_'))
          if len(icon_names) < 10:
              icon_names = ['home','user','users','gear','cog','settings','search','heart','star','check','xmark','plus','minus','bars','camera','image','phone','envelope','bell','comment','share','link','globe','lock','unlock','eye','download','upload','file','folder','calendar','clock','map','trash','pen','list','filter','arrowLeft','arrowRight','arrowUp','arrowDown','chevronLeft','chevronRight','info','warning','play','pause','whatsapp','telegram','facebook','instagram','twitter','youtube','github','google','apple','android']
          print('icon count:', len(icon_names))
          material_map = {'home':'Icons.home','user':'Icons.person','users':'Icons.people','gear':'Icons.settings','cog':'Icons.settings','settings':'Icons.settings','search':'Icons.search','heart':'Icons.favorite','star':'Icons.star','check':'Icons.check','xmark':'Icons.close','times':'Icons.close','close':'Icons.close','plus':'Icons.add','minus':'Icons.remove','bars':'Icons.menu','camera':'Icons.camera_alt','image':'Icons.image','phone':'Icons.phone','envelope':'Icons.email','bell':'Icons.notifications','comment':'Icons.comment','share':'Icons.share','link':'Icons.link','globe':'Icons.public','lock':'Icons.lock','unlock':'Icons.lock_open','eye':'Icons.visibility','download':'Icons.download','upload':'Icons.upload','file':'Icons.insert_drive_file','folder':'Icons.folder','calendar':'Icons.calendar_today','clock':'Icons.access_time','map':'Icons.map','trash':'Icons.delete','pen':'Icons.edit','list':'Icons.list','arrowLeft':'Icons.arrow_back','arrowRight':'Icons.arrow_forward','chevronLeft':'Icons.chevron_left','chevronRight':'Icons.chevron_right','info':'Icons.info','warning':'Icons.warning','play':'Icons.play_arrow','whatsapp':'Icons.chat','telegram':'Icons.send','facebook':'Icons.facebook','github':'Icons.code','google':'Icons.g_mobiledata','apple':'Icons.apple','android':'Icons.android'}
          lines = ['library font_awesome_flutter;', "import 'package:flutter/material.dart';", '', 'class FaIcon extends StatelessWidget {', '  final IconData icon;', '  final double? size;', '  final Color? color;', '  final String? semanticLabel;', '  final TextDirection? textDirection;', '  const FaIcon(this.icon, {super.key, this.size, this.color, this.semanticLabel, this.textDirection});', '  @override', '  Widget build(BuildContext context) => Icon(icon, size: size, color: color, semanticLabel: semanticLabel, textDirection: textDirection);', '}', '', 'class FontAwesomeIcons {', '  const FontAwesomeIcons._();']
          for name in icon_names:
              mapped = material_map.get(name, 'Icons.circle')
              lines.append(f'  static const IconData {name} = {mapped};')
          lines.append('}')
          stub = '\n'.join(lines) + '\n'
          for root in roots:
              lib = root / 'lib'
              if lib.exists():
                  for old in list(lib.rglob('*.dart')):
                      try: old.unlink()
                      except Exception: pass
              lib.mkdir(parents=True, exist_ok=True)
              (lib / 'font_awesome_flutter.dart').write_text(stub, encoding='utf-8')
              (root / 'pubspec.yaml').write_text("name: font_awesome_flutter\nversion: 11.0.0\npublish_to: none\nenvironment:\n  sdk: '>=3.0.0 <4.0.0'\ndependencies:\n  flutter:\n    sdk: flutter\n", encoding='utf-8')
              print('stub at', root)
          print('done')
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          if [ -z "$(ls -A out/*.apk 2>/dev/null)" ]; then
            find "${{ env.PROJECT_ROOT }}" -name "*.apk" -print -exec cp {} out/ \;
          fi
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
