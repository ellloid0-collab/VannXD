name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter (direct file URL)
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then echo "File terlalu kecil"; head -c 400 project.zip; exit 1; fi
          if ! head -c 2 project.zip | grep -q "PK"; then echo "Bukan ZIP"; file project.zip; exit 1; fi
          mkdir -p project
          unzip -q project.zip -d project
          ROOT=$(find project -name "pubspec.yaml" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo "pubspec.yaml tidak ditemukan"; find project -maxdepth 4 -type f | head -80; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Patch Gradle + AGP for modern Flutter
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i -E 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' "$PROP"
            echo "Gradle wrapper -> 8.14.3"
            cat "$PROP"
          fi

          # Patch semua gradle files: AGP >= 8.11.1 (Flutter min), Kotlin modern
          while IFS= read -r -d '' f; do
            echo "Patch $f"
            # classpath style
            sed -i -E 's/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.11.1/g' "$f" || true
            # plugins DSL style
            sed -i -E 's/(id\([\"'\'']com\.android\.application[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\([\"'\'']com\.android\.library[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\([\"'\'']org\.jetbrains\.kotlin\.android[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"2.1.0"/g' "$f" || true
            # kotlin gradle plugin classpath
            sed -i -E 's/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+/org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0/g' "$f" || true
          done < <(find "$ROOT/android" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 2>/dev/null)

          # settings.gradle plugins block sometimes uses different quoting
          for f in "$ROOT/android/settings.gradle" "$ROOT/android/settings.gradle.kts" "$ROOT/android/build.gradle" "$ROOT/android/build.gradle.kts"; do
            [ -f "$f" ] || continue
            sed -i -E 's/com\.android\.application["'\'']?\)?[[:space:]]+version[[:space:]]+["'\''][0-9.]+["'\'']/com.android.application") version "8.11.1"/g' "$f" || true
          done

          echo "==== android gradle files (grep AGP) ===="
          grep -RIn "com.android|agp|gradle:" "$ROOT/android" --include="*.gradle" --include="*.gradle.kts" 2>/dev/null | head -40 || true
          echo "Gradle+AGP patch done"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
