name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip

          download_ok=0
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            echo "Mode: GitHub API asset"
            CODE=$(curl -sS -L -o project.zip -w "%{http_code}" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "User-Agent: VannXD-Build" \
              "$ZIP_URL" || true)
            echo "API download HTTP $CODE size=$(wc -c < project.zip 2>/dev/null || echo 0)"
            if [ "$CODE" = "200" ] && [ -s project.zip ] && ! head -c 1 project.zip | grep -q '{'; then
              download_ok=1
            fi
          fi

          if [ "$download_ok" != "1" ]; then
            echo "Mode: public/direct URL (no special Accept)"
            CODE=$(curl -sS -L -o project.zip -w "%{http_code}" \
              -H "User-Agent: VannXD-Build" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "$ZIP_URL" || true)
            echo "Direct download HTTP $CODE size=$(wc -c < project.zip 2>/dev/null || echo 0)"
            if [ "$CODE" = "200" ] && [ -s project.zip ] && ! head -c 1 project.zip | grep -q '{'; then
              download_ok=1
            fi
          fi

          if [ "$download_ok" != "1" ]; then
            echo "Mode: anonymous curl"
            curl -sS -L -o project.zip -H "User-Agent: VannXD-Build" "$ZIP_URL" || true
          fi

          if [ ! -s project.zip ]; then
            echo "File kosong"
            exit 1
          fi
          if head -c 1 project.zip | grep -q '{'; then
            echo "Response JSON (bukan ZIP):"
            head -c 800 project.zip || true
            exit 1
          fi
          file project.zip || true

          mkdir -p project
          unzip -q project.zip -d project
          ROOT=$(find project -name "pubspec.yaml" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then
            echo "pubspec.yaml tidak ditemukan"
            find project -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
