name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          test "$SIZE" -ge 1000
          head -c 2 project.zip | grep -q "PK"
          mkdir -p project
          unzip -q project.zip -d project
          # Jangan pakai xargs — path bisa berisi spasi (contoh: "alternity v1 jie")
          PUBSPEC=$(find project -name "pubspec.yaml" -print -quit)
          test -n "$PUBSPEC"
          ROOT=$(dirname "$PUBSPEC")
          test -n "$ROOT"
          # GITHUB_ENV aman untuk path ber-spasi
          echo "PROJECT_ROOT<<EOF" >> "$GITHUB_ENV"
          echo "$ROOT" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Patch project for modern Flutter
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          echo "Using PROJECT_ROOT=$ROOT"
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.3-all.zip|' "$PROP"
            cat "$PROP"
          fi
          python3 - "$ROOT" <<'PY'
          import sys, re
          from pathlib import Path
          root = Path(sys.argv[1])
          android = root / "android"
          if not android.exists():
              print("no android dir")
              sys.exit(0)
          paths = []
          for pat in ("*.gradle", "*.gradle.kts"):
              for path in android.rglob(pat):
                  if path.is_file():
                      paths.append(path)
          for path in paths:
              text = path.read_text(encoding="utf-8", errors="ignore")
              orig = text
              text = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.11.1", text)
              text = re.sub(r"(id\(['\"]com\.android\.application['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"8.11.1"', text)
              text = re.sub(r"(id\(['\"]com\.android\.library['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"8.11.1"', text)
              text = re.sub(r"(id\(['\"]org\.jetbrains\.kotlin\.android['\"]\)\s+version\s+)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
              text = re.sub(r"org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+", "org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20", text)
              text = re.sub(r"(ext\.kotlin_version\s*=\s*)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
              text = re.sub(r"(kotlin_version\s*=\s*)['\"][0-9.]+['\"]", r'\1"2.2.20"', text)
              if text != orig:
                  path.write_text(text, encoding="utf-8")
                  print("patched", path)
          print("android patch done")
          PY
          python3 - "$ROOT" <<'PY'
          import sys, re
          from pathlib import Path
          pub = Path(sys.argv[1]) / "pubspec.yaml"
          if not pub.exists():
              sys.exit(0)
          text = pub.read_text(encoding="utf-8", errors="ignore")
          if "font_awesome_flutter" in text:
              text = re.sub(r"font_awesome_flutter\s*:\s*[^\n]+", "font_awesome_flutter: any", text)
              pub.write_text(text, encoding="utf-8")
              print("pubspec font_awesome -> any")
          PY

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get

      - name: Fix font_awesome IconData final class
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path
          cache = Path.home() / ".pub-cache"
          files = [p for p in cache.rglob("*.dart") if "font_awesome_flutter" in str(p) and p.is_file()]
          print("fa files", len(files))
          helper = (
              "import 'package:flutter/widgets.dart';\n"
              "IconData _fa(int c, String fam) => IconData(c, fontFamily: fam, fontPackage: 'font_awesome_flutter');\n"
              "IconData iconDataBrands(int c) => _fa(c, 'FontAwesomeBrands');\n"
              "IconData iconDataSolid(int c) => _fa(c, 'FontAwesomeSolid');\n"
              "IconData iconDataRegular(int c) => _fa(c, 'FontAwesomeRegular');\n"
              "IconData iconDataLight(int c) => _fa(c, 'FontAwesomeLight');\n"
              "IconData iconDataThin(int c) => _fa(c, 'FontAwesomeThin');\n"
              "IconData iconDataDuotone(int c) => _fa(c, 'FontAwesomeDuotone');\n"
          )
          for path in files:
              if path.name == "icon_data.dart":
                  path.write_text(helper, encoding="utf-8")
                  print("rewrote", path)
          repls = [
              (r'const\s+IconDataBrands\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeBrands", fontPackage: "font_awesome_flutter")'),
              (r'IconDataBrands\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeBrands", fontPackage: "font_awesome_flutter")'),
              (r'const\s+IconDataSolid\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeSolid", fontPackage: "font_awesome_flutter")'),
              (r'IconDataSolid\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeSolid", fontPackage: "font_awesome_flutter")'),
              (r'const\s+IconDataRegular\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeRegular", fontPackage: "font_awesome_flutter")'),
              (r'IconDataRegular\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeRegular", fontPackage: "font_awesome_flutter")'),
              (r'const\s+IconDataLight\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeLight", fontPackage: "font_awesome_flutter")'),
              (r'IconDataLight\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeLight", fontPackage: "font_awesome_flutter")'),
              (r'const\s+IconDataThin\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeThin", fontPackage: "font_awesome_flutter")'),
              (r'IconDataThin\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeThin", fontPackage: "font_awesome_flutter")'),
              (r'const\s+IconDataDuotone\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeDuotone", fontPackage: "font_awesome_flutter")'),
              (r'IconDataDuotone\s*\(\s*([0-9a-fxA-F]+)\s*\)', r'IconData(\1, fontFamily: "FontAwesomeDuotone", fontPackage: "font_awesome_flutter")'),
          ]
          for path in files:
              if path.name == "icon_data.dart":
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              orig = text
              for pat, rep in repls:
                  text = re.sub(pat, rep, text)
              if text != orig:
                  path.write_text(text, encoding="utf-8")
                  print("patched", path.name)
          print("font_awesome fix done")
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
