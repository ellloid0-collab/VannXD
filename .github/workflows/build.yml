name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter (direct file URL)
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then echo "File terlalu kecil"; head -c 400 project.zip; exit 1; fi
          if ! head -c 2 project.zip | grep -q "PK"; then echo "Bukan ZIP"; file project.zip; exit 1; fi
          mkdir -p project
          unzip -q project.zip -d project
          ROOT=$(find project -name "pubspec.yaml" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo "pubspec.yaml tidak ditemukan"; find project -maxdepth 4 -type f | head -80; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter / Dart version
        run: |
          flutter --version
          dart --version

      - name: Patch pubspec + Android toolchain
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          PUB="$ROOT/pubspec.yaml"
          if [ -f "$PUB" ] && grep -q "font_awesome_flutter" "$PUB"; then
            python3 -c "
          from pathlib import Path
          import re
          pub = Path(r'''$PUB''')
          text = pub.read_text(encoding='utf-8', errors='ignore')
          text = re.sub(r'\ndependency_overrides:\n(?:  .+\n)*', '\n', text)
          text = re.sub(r'font_awesome_flutter\s*:\s*[^\n]+', 'font_awesome_flutter: any', text)
          if 'font_awesome_flutter' in text and 'dependency_overrides:' not in text:
              text = text.rstrip() + '\n\ndependency_overrides:\n  font_awesome_flutter:\n    git:\n      url: https://github.com/fluttercommunity/font_awesome_flutter.git\n      ref: master\n'
          pub.write_text(text + '\n', encoding='utf-8')
          print('pubspec patched')
          "
          fi
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i -E 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-all.zip|' "$PROP"
            cat "$PROP"
          fi
          while IFS= read -r -d '' f; do
            sed -i -E 's/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.11.1/g' "$f" || true
            sed -i -E 's/(id\(["'\'']com\.android\.application["'\\'']\) version )["'\\''][0-9.]+["'\\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\(["'\\'']com\.android\.library["'\\'']\) version )["'\\''][0-9.]+["'\\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\(["'\\'']org\.jetbrains\.kotlin\.android["'\\'']\) version )["'\\''][0-9.]+["'\\'']/\1"2.2.20"/g' "$f" || true
            sed -i -E 's/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+/org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20/g' "$f" || true
            sed -i -E 's/ext\.kotlin_version[[:space:]]*=[[:space:]]*["'\\''][0-9.]+["'\\'']/ext.kotlin_version = "2.2.20"/g' "$f" || true
            sed -i -E 's/kotlin_version[[:space:]]*=[[:space:]]*["'\\''][0-9.]+["'\\'']/kotlin_version = "2.2.20"/g' "$f" || true
          done < <(find "$ROOT/android" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 2>/dev/null)
          echo "Android patch done"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
