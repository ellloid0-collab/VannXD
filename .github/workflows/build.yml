name: Flutter Zip2Apps Build

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter (direct file URL)
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          if [ "$SIZE" -lt 1000 ]; then echo "File terlalu kecil"; head -c 400 project.zip; exit 1; fi
          if ! head -c 2 project.zip | grep -q "PK"; then echo "Bukan ZIP"; file project.zip; exit 1; fi
          mkdir -p project
          unzip -q project.zip -d project
          ROOT=$(find project -name "pubspec.yaml" | head -n 1 | xargs -r dirname)
          if [ -z "$ROOT" ]; then echo "pubspec.yaml tidak ditemukan"; find project -maxdepth 4 -type f | head -80; exit 1; fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Found project at $ROOT"

      - name: Setup Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter / Dart version
        run: |
          flutter --version
          dart --version

      - name: Patch pubspec (font_awesome + SDK) + Android toolchain
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          PUB="$ROOT/pubspec.yaml"

          # Longgarkan environment sdk biar resolvable
          if [ -f "$PUB" ]; then
            # dependency_overrides untuk font_awesome_flutter (IconData final di Flutter baru)
            if grep -q "font_awesome_flutter" "$PUB"; then
              if grep -q "^dependency_overrides:" "$PUB"; then
                if ! grep -q "font_awesome_flutter:" "$PUB"; then
                  sed -i '/^dependency_overrides:/a\  font_awesome_flutter: 10.9.0' "$PUB"
                fi
              else
                printf '\ndependency_overrides:\n  font_awesome_flutter: 10.9.0\n' >> "$PUB"
              fi
              echo "Override font_awesome_flutter -> 10.9.0"
            fi
            echo "==== pubspec (tail) ===="
            tail -30 "$PUB" || true
          fi

          # Gradle 9.1.0 + AGP 8.11.1 + Kotlin 2.2.20
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i -E 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-all.zip|' "$PROP"
            cat "$PROP"
          fi
          while IFS= read -r -d '' f; do
            sed -i -E 's/com\.android\.tools\.build:gradle:[0-9]+\.[0-9]+\.[0-9]+/com.android.tools.build:gradle:8.11.1/g' "$f" || true
            sed -i -E 's/(id\([\"'\'']com\.android\.application[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\([\"'\'']com\.android\.library[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"8.11.1"/g' "$f" || true
            sed -i -E 's/(id\([\"'\'']org\.jetbrains\.kotlin\.android[\"'\'']\) version )[\"'\''][0-9.]+[\"'\'']/\1"2.2.20"/g' "$f" || true
            sed -i -E 's/org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9.]+/org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20/g' "$f" || true
            sed -i -E 's/ext\.kotlin_version[[:space:]]*=[[:space:]]*["'\''][0-9.]+["'\'']/ext.kotlin_version = "2.2.20"/g' "$f" || true
            sed -i -E 's/kotlin_version[[:space:]]*=[[:space:]]*["'\''][0-9.]+["'\'']/kotlin_version = "2.2.20"/g' "$f" || true
          done < <(find "$ROOT/android" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 2>/dev/null)
          echo "Android patch done"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          flutter pub get

      - name: Patch font_awesome IconData if still broken
        run: |
          set -euo pipefail
          # Kalau package masih extends IconData (final), rewrite jadi IconData biasa
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path.home() / ".pub-cache"
          fixed = 0
          for path in root.rglob("icon_data.dart"):
              if "font_awesome_flutter" not in str(path):
                  continue
              text = path.read_text(encoding="utf-8", errors="ignore")
              if "extends IconData" not in text:
                  continue
              # Ubah: class Foo extends IconData { const Foo(int codePoint) : super(...); }
              # menjadi fungsi/const IconData helper sedapatnya — pendekatan praktis:
              # ganti "extends IconData" dan constructor super() → IconData(...)
              new = text
              new = new.replace("extends IconData", "")
              # const Xxx(int codePoint) : super(codePoint, fontFamily: 'Y', fontPackage: 'Z');
              new = re.sub(
                  r"const\s+(\w+)\(\s*int\s+codePoint\s*\)\s*:\s*super\(\s*codePoint\s*,",
                  r"static IconData \1(int codePoint) => IconData(codePoint,",
                  new,
              )
              # variant with super.codePoint
              new = re.sub(
                  r"const\s+(\w+)\(\s*super\.codePoint\s*(?:,\s*)?",
                  r"static IconData \1(int codePoint) => IconData(codePoint, ",
                  new,
              )
              if new != text:
                  path.write_text(new, encoding="utf-8")
                  fixed += 1
                  print("patched", path)
          print("fixed_files", fixed)
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        run: |
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: out/*.apk
          if-no-files-found: error
