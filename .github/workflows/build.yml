name: Flutter Zip2Apps Build

"on":
  workflow_dispatch:
    inputs:
      zip_url:
        description: URL ZIP project Flutter
        required: true
        type: string
      tag:
        description: Release tag
        required: true
        type: string
      build_type:
        description: debug or release
        required: true
        type: string
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download project ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "ZIP_URL=$ZIP_URL"
          rm -f project.zip
          if echo "$ZIP_URL" | grep -q "api.github.com"; then
            curl -fsSL -L -o project.zip \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$ZIP_URL"
          else
            curl -fsSL -L -o project.zip -H "User-Agent: VannXD-Build/1.0" "$ZIP_URL"
          fi
          SIZE=$(wc -c < project.zip)
          echo "Downloaded size=$SIZE"
          test "$SIZE" -ge 1000
          head -c 2 project.zip | grep -q "PK"
          mkdir -p project
          unzip -q project.zip -d project
          PUBSPEC=$(find project -name "pubspec.yaml" -print -quit)
          test -n "$PUBSPEC"
          ROOT=$(dirname "$PUBSPEC")
          {
            echo "PROJECT_ROOT<<EOF"
            echo "$ROOT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Found project at: $ROOT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Nuclear Android + AGP + Gradle patch
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          export ROOT
          echo "ROOT=$ROOT"

          # 1) Force Gradle wrapper
          PROP="$ROOT/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$PROP" ]; then
            sed -i "s|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-all.zip|" "$PROP"
            echo "Gradle wrapper forced to 8.14.3"
            cat "$PROP"
          else
            echo "WARNING: no gradle-wrapper.properties"
          fi

          # 2) Nuclear AGP + Kotlin patch on ALL gradle files + version catalogs
          python3 <<'PY'
          import re, os
          from pathlib import Path

          root = Path(os.environ["ROOT"])
          android = root / "android"
          if not android.exists():
              print("no android dir — skip")
              raise SystemExit(0)

          TARGET_AGP = "8.11.1"
          TARGET_KOTLIN = "2.2.20"

          patterns = [
              # Classic classpath
              (re.compile(r"(com\.android\.tools\.build:gradle:)[0-9.]+"), rf"\g<1>{TARGET_AGP}"),
              # plugins { id "com.android.xxx" version "X.Y.Z" }
              (re.compile(r'''((?:id\s*\(?\s*["']com\.android\.[a-z.]+["']\s*\)?\s+version\s+)["'])[0-9.]+(["'])'''), rf"\g<1>{TARGET_AGP}\g<2>"),
              # plugins { id("com.android.xxx") version "X.Y.Z" } already covered above
              # version catalog: agp = "8.9.1" or androidGradlePlugin = "..."
              (re.compile(r'''((?:agp|androidGradlePlugin|android-gradle-plugin)\s*=\s*["'])[0-9.]+(["'])''', re.I), rf"\g<1>{TARGET_AGP}\g<2>"),
              # Kotlin plugin version (optional but helps)
              (re.compile(r'''((?:id\s*\(?\s*["']org\.jetbrains\.kotlin\.(?:android|jvm|multiplatform)["']\s*\)?\s+version\s+)["'])[0-9.]+(["'])'''), rf"\g<1>{TARGET_KOTLIN}\g<2>"),
              (re.compile(r'''((?:kotlin|kotlinVersion)\s*=\s*["'])[0-9.]+(["'])''', re.I), rf"\g<1>{TARGET_KOTLIN}\g<2>"),
              (re.compile(r"(org\.jetbrains\.kotlin:kotlin-gradle-plugin:)[0-9.]+"), rf"\g<1>{TARGET_KOTLIN}"),
              (re.compile(r"""((?:ext\.)?kotlin_version\s*=\s*['"])[0-9.]+(['"])"""), rf"\g<1>{TARGET_KOTLIN}\g<2>"),
              (re.compile(r"""((?:ext\.)?kotlinVersion\s*=\s*['"])[0-9.]+(['"])"""), rf"\g<1>{TARGET_KOTLIN}\g<2>"),
          ]

          files = []
          for pattern in ["*.gradle", "*.gradle.kts", "*.toml"]:
              files.extend([p for p in android.rglob(pattern) if p.is_file()])
          # also top-level if any
          for pattern in ["*.gradle", "*.gradle.kts", "*.toml"]:
              files.extend([p for p in root.glob(pattern) if p.is_file()])

          patched_count = 0
          for path in files:
              try:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              orig = text
              for rx, repl in patterns:
                  text = rx.sub(repl, text)
              if text != orig:
                  path.write_text(text, encoding="utf-8")
                  print("patched:", path)
                  patched_count += 1

          print(f"android done — {patched_count} file(s) patched")
          # Debug: show any remaining old AGP refs
          for path in files:
              try:
                  t = path.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              for m in re.finditer(r"com\.android\.[a-z.]+[^\n]{0,40}[0-9]+\.[0-9]+\.[0-9]+", t):
                  print("  still-has:", path.name, "→", m.group(0)[:80])
          PY

          # 3) Force Kotlin >= 2.2.20 on every gradle file (Flutter min)
          find "$ROOT/android" -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "*.toml" \) 2>/dev/null | while read -r f; do
            # bump common version forms to 2.2.20
            sed -i -E \
              -e 's/(org\.jetbrains\.kotlin\.[a-z."() ]*version[: =]*["'\''"]?)2\.[01]\.[0-9]+/\12.2.20/g' \
              -e 's/(kotlin[_-]?[Vv]ersion\s*=\s*["'\''"]?)2\.[01]\.[0-9]+/\12.2.20/g' \
              -e 's/(kotlin-gradle-plugin:)2\.[01]\.[0-9]+/\12.2.20/g' \
              -e 's/(kotlin\s*=\s*["'\''"]?)2\.[01]\.[0-9]+/\12.2.20/g' \
              "$f" 2>/dev/null || true
          done
          echo "Kotlin force-bump to 2.2.20 done"

      - name: Flutter pub get
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          rm -f pubspec.lock
          if [ -f pubspec.yaml ]; then
            sed -i -E "s|font_awesome_flutter[[:space:]]*:[[:space:]]*.*|font_awesome_flutter: any|" pubspec.yaml || true
          fi
          flutter pub get

      - name: Nuclear FA stub
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          cache = Path.home() / ".pub-cache"
          roots = []
          for p in cache.rglob("pubspec.yaml"):
              try:
                  t = p.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              if re.search(r"^name:\s*font_awesome_flutter\s*$", t, re.M):
                  roots.append(p.parent)
          print("FA roots:", roots)
          if not roots:
              print("no FA — skip")
              raise SystemExit(0)

          icon_names = set()
          for root in roots:
              for dart in root.rglob("*.dart"):
                  try:
                      txt = dart.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      continue
                  for m in re.finditer(r"static\s+const\s+(?:IconData|FaIconData|FalconData|\w+)\s+(\w+)\s*=", txt):
                      icon_names.add(m.group(1))
                  for m in re.finditer(r"static\s+const\s+(\w+)\s*=\s*IconData", txt):
                      icon_names.add(m.group(1))

          bad = {"IconData", "FaIcon", "FontAwesomeIcons", "index", "main", "toString", "hashCode", "runtimeType"}
          icon_names = sorted(n for n in icon_names if n.isidentifier() and n not in bad and not n.startswith("_"))
          if len(icon_names) < 5:
              icon_names = [
                  "home", "user", "users", "gear", "cog", "settings", "search", "heart", "star",
                  "check", "xmark", "times", "close", "plus", "minus", "bars", "camera", "image",
                  "phone", "envelope", "bell", "comment", "comments", "share", "link", "globe",
                  "lock", "unlock", "eye", "download", "upload", "file", "folder", "calendar",
                  "clock", "map", "trash", "pen", "list", "filter", "arrowLeft", "arrowRight",
                  "arrowUp", "arrowDown", "chevronLeft", "chevronRight", "info", "warning",
                  "play", "pause", "whatsapp", "telegram", "facebook", "instagram", "twitter",
                  "youtube", "github", "google", "apple", "android"
              ]

          material_map = {
              "home": "Icons.home", "user": "Icons.person", "users": "Icons.people",
              "gear": "Icons.settings", "cog": "Icons.settings", "settings": "Icons.settings",
              "search": "Icons.search", "heart": "Icons.favorite", "star": "Icons.star",
              "check": "Icons.check", "xmark": "Icons.close", "times": "Icons.close",
              "close": "Icons.close", "plus": "Icons.add", "minus": "Icons.remove",
              "bars": "Icons.menu", "camera": "Icons.camera_alt", "image": "Icons.image",
              "phone": "Icons.phone", "envelope": "Icons.email", "bell": "Icons.notifications",
              "comment": "Icons.comment", "comments": "Icons.comment", "share": "Icons.share",
              "link": "Icons.link", "globe": "Icons.public", "lock": "Icons.lock",
              "unlock": "Icons.lock_open", "eye": "Icons.visibility", "download": "Icons.download",
              "upload": "Icons.upload", "file": "Icons.insert_drive_file", "folder": "Icons.folder",
              "calendar": "Icons.calendar_today", "clock": "Icons.access_time", "map": "Icons.map",
              "trash": "Icons.delete", "pen": "Icons.edit", "list": "Icons.list",
              "filter": "Icons.filter_list", "arrowLeft": "Icons.arrow_back",
              "arrowRight": "Icons.arrow_forward", "arrowUp": "Icons.arrow_upward",
              "arrowDown": "Icons.arrow_downward", "chevronLeft": "Icons.chevron_left",
              "chevronRight": "Icons.chevron_right", "info": "Icons.info", "warning": "Icons.warning",
              "play": "Icons.play_arrow", "pause": "Icons.pause", "whatsapp": "Icons.chat",
              "telegram": "Icons.send", "facebook": "Icons.facebook", "instagram": "Icons.camera",
              "twitter": "Icons.alternate_email", "youtube": "Icons.play_circle",
              "github": "Icons.code", "google": "Icons.g_mobiledata", "apple": "Icons.apple",
              "android": "Icons.android",
          }

          lines = [
              "library font_awesome_flutter;",
              "import 'package:flutter/material.dart';",
              "",
              "class FaIcon extends StatelessWidget {",
              "  final IconData icon;",
              "  final double? size;",
              "  final Color? color;",
              "  final String? semanticLabel;",
              "  final TextDirection? textDirection;",
              "  const FaIcon(this.icon, {super.key, this.size, this.color, this.semanticLabel, this.textDirection});",
              "  @override",
              "  Widget build(BuildContext context) => Icon(icon, size: size, color: color, semanticLabel: semanticLabel, textDirection: textDirection);",
              "}",
              "",
              "class FontAwesomeIcons {",
              "  const FontAwesomeIcons._();",
          ]
          for name in icon_names:
              mapped = material_map.get(name, "Icons.circle")
              lines.append(f"  static const IconData {name} = {mapped};")
          lines.append("}")
          stub = "\n".join(lines) + "\n"

          for root in roots:
              lib = root / "lib"
              if lib.exists():
                  for old in list(lib.rglob("*.dart")):
                      try:
                          old.unlink()
                      except Exception:
                          pass
              lib.mkdir(parents=True, exist_ok=True)
              (lib / "font_awesome_flutter.dart").write_text(stub, encoding="utf-8")
              (root / "pubspec.yaml").write_text(
                  "name: font_awesome_flutter\n"
                  "version: 11.0.0\n"
                  "publish_to: none\n"
                  "environment:\n"
                  "  sdk: '>=3.0.0 <4.0.0'\n"
                  "dependencies:\n"
                  "  flutter:\n"
                  "    sdk: flutter\n",
                  encoding="utf-8",
              )
              print("stub installed at", root)
          print("done")
          PY

      - name: Speed Gradle flags (NO minify — avoids double build)
        env:
          ROOT: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          ROOT="${{ env.PROJECT_ROOT }}"
          export ROOT
          GP="$ROOT/android/gradle.properties"
          mkdir -p "$ROOT/android"
          touch "$GP"
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"
            echo "org.gradle.parallel=true"
            echo "org.gradle.caching=true"
            echo "org.gradle.daemon=true"
            echo "org.gradle.configureondemand=true"
            echo "org.gradle.workers.max=4"
            echo "android.useAndroidX=true"
            echo "android.enableR8.fullMode=false"
          } >> "$GP"

          # FORCE minify OFF everywhere (R8 was causing fail + 2x compile = 2x slower)
          python3 <<'PY'
          import re, os
          from pathlib import Path
          root = Path(os.environ["ROOT"])
          android = root / "android"
          if not android.exists():
              raise SystemExit(0)
          for path in list(android.rglob("build.gradle")) + list(android.rglob("build.gradle.kts")):
              if not path.is_file():
                  continue
              t = path.read_text(encoding="utf-8", errors="ignore")
              o = t
              t = re.sub(r"minifyEnabled\s+true", "minifyEnabled false", t)
              t = re.sub(r"shrinkResources\s+true", "shrinkResources false", t)
              t = re.sub(r"isMinifyEnabled\s*=\s*true", "isMinifyEnabled = false", t)
              t = re.sub(r"isShrinkResources\s*=\s*true", "isShrinkResources = false", t)
              if t != o:
                  path.write_text(t, encoding="utf-8")
                  print("minify OFF:", path)
          print("speed flags done — single pass build")
          PY

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          set -euo pipefail
          BT="${{ inputs.build_type }}"
          # Single pass only. arm64 = smaller + faster than universal/fat APK.
          if [ "$BT" = "debug" ]; then
            flutter build apk --debug --target-platform android-arm64 \
              || flutter build apk --debug --target-platform android-arm64 --android-skip-build-dependency-validation
          else
            flutter build apk --release --target-platform android-arm64 --tree-shake-icons \
              || flutter build apk --release --target-platform android-arm64 --tree-shake-icons --android-skip-build-dependency-validation
          fi

      - name: Collect APK + fast mirror
        run: |
          set -euo pipefail
          mkdir -p out
          find "${{ env.PROJECT_ROOT }}" -path "*/flutter-apk/*.apk" -print -exec cp {} out/ \;
          if [ -z "$(ls -A out/*.apk 2>/dev/null)" ]; then
            find "${{ env.PROJECT_ROOT }}" -name "*.apk" ! -path "*/out/*" -print -exec cp {} out/ \;
          fi
          ls -lah out || true
          test -n "$(ls -A out/*.apk 2>/dev/null)"
          APK=$(ls out/*.apk | head -1)
          echo "APK=$APK size=$(du -h "$APK" | cut -f1)"
          # Upload mirror for instant user download (bot can send link without re-upload)
          set +e
          MIRROR=$(curl -sS -F "reqtype=fileupload" -F "fileToUpload=@${APK}" https://catbox.moe/user/api.php --max-time 90)
          RC=$?
          set -e
          if [ $RC -eq 0 ] && echo "$MIRROR" | grep -q '^https://'; then
            echo "$MIRROR" | tr -d '\r' > out/mirror.txt
            echo "MIRROR_OK $MIRROR"
          else
            echo "MIRROR_FAIL ${MIRROR:-empty}"
            echo "" > out/mirror.txt
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-build
          path: |
            out/*.apk
            out/mirror.txt
          if-no-files-found: error
