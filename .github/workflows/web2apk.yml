name: Web2Apps Build

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: Website URL
        required: true
        type: string
      app_name:
        description: App name
        required: true
        type: string
      icon_url:
        description: Icon image URL
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create WebView app
        env:
          APP_NAME: ${{ inputs.app_name }}
          WEB_URL: ${{ inputs.web_url }}
        run: |
          set -euo pipefail
          SAFE=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          if [ -z "$SAFE" ]; then SAFE=webapp; fi
          flutter create --org com.patlapan --project-name "$SAFE" app
          cd app
          python3 - <<'PY'
          import os, pathlib
          web = os.environ.get("WEB_URL", "https://example.com").replace("'", "\\'")
          dart = f'''import 'package:flutter/material.dart';
import 'package:webview_flutter/webview_flutter.dart';

void main() => runApp(const MyApp());

class MyApp extends StatelessWidget {{
  const MyApp({{super.key}});
  @override
  Widget build(BuildContext context) {{
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      home: Scaffold(
        body: SafeArea(
          child: WebViewWidget(
            controller: WebViewController()
              ..setJavaScriptMode(JavaScriptMode.unrestricted)
              ..loadRequest(Uri.parse('{web}')),
          ),
        ),
      ),
    );
  }}
}}
'''
          pathlib.Path("lib/main.dart").write_text(dart)
          print("main.dart written", web)
          PY
          if ! grep -q webview_flutter pubspec.yaml; then
            printf '\n  webview_flutter: ^4.7.0\n' >> pubspec.yaml
          fi
          flutter pub get

      - name: Optional icon
        env:
          ICON: ${{ inputs.icon_url }}
        run: |
          set -euo pipefail
          cd app
          if [ -n "$ICON" ]; then
            curl -fsSL -L -o /tmp/icon.png "$ICON" || true
            if [ -f /tmp/icon.png ]; then
              mkdir -p assets
              cp /tmp/icon.png assets/icon.png || true
            fi
          fi
          echo "icon step done"

      - name: Build APK
        run: |
          set -euo pipefail
          cd app
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/ || true
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/app.apk
          ls -lh dist/app.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: dist/
          if-no-files-found: error
