# Vann-XD — Android Native (Java/Kotlin) build
name: Build Android Native

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Android"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_type:
        description: "debug | release"
        required: true
        type: string
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          if [ -d "$ANDROID_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" --licenses >/tmp/licenses.txt 2>&1 || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2"
          echo "SDK ready"

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          curl -fsSL -L --retry 5 --retry-delay 3 -o project.zip "$ZIP_URL"
          ls -lh project.zip
          mkdir -p work
          unzip -q project.zip -d work
          echo "=== structure ==="
          find work -maxdepth 4 \( -name 'settings.gradle*' -o -name 'build.gradle*' -o -name 'AndroidManifest.xml' -o -name 'gradlew' \) 2>/dev/null | head -40
          ROOT=""
          # prioritaskan folder yang punya settings.gradle
          while IFS= read -r f; do
            ROOT=$(dirname "$f")
            break
          done < <(find work -maxdepth 8 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) 2>/dev/null | sort)
          if [ -z "$ROOT" ]; then
            while IFS= read -r f; do
              # skip pure library modules without settings if possible
              ROOT=$(dirname "$f")
              break
            done < <(find work -maxdepth 8 \( -name 'build.gradle' -o -name 'build.gradle.kts' \) 2>/dev/null | sort)
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::Tidak ditemukan settings.gradle / build.gradle di ZIP"
            find work -maxdepth 5 -type f | head -100
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Root project: $ROOT"
          ls -la "$ROOT"

      - name: Install Gradle & fix wrapper
        run: |
          set -euo pipefail
          GRADLE_VER=8.7
          if ! command -v gradle >/dev/null 2>&1; then
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            echo "/opt/gradle-${GRADLE_VER}/bin" >> "$GITHUB_PATH"
            export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
          fi
          cd "$PROJECT_ROOT"
          # Hapus wrapper rusak (tanpa jar / class not found)
          NEED_WRAPPER=0
          if [ ! -f gradlew ]; then
            NEED_WRAPPER=1
          elif [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            NEED_WRAPPER=1
          else
            # tes jar ada Main-Class
            if ! jar tf gradle/wrapper/gradle-wrapper.jar 2>/dev/null | grep -q 'GradleWrapperMain'; then
              NEED_WRAPPER=1
            fi
          fi
          if [ "$NEED_WRAPPER" = "1" ]; then
            echo "Regenerating Gradle wrapper..."
            rm -rf gradle/wrapper gradlew gradlew.bat 2>/dev/null || true
            mkdir -p gradle/wrapper
            gradle wrapper --gradle-version "$GRADLE_VER"
          fi
          chmod +x gradlew
          # pastikan properties
          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat > gradle/wrapper/gradle-wrapper.properties << EOF
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
          fi
          # download wrapper jar resmi jika masih hilang
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VER}.0/gradle/wrapper/gradle-wrapper.jar" \
              || curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi
          ls -la gradlew gradle/wrapper/ || true
          ./gradlew --version

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          TYPE="${{ inputs.build_type }}"
          echo "Building ($TYPE) in $PROJECT_ROOT"
          if [ "$TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            ./gradlew assembleRelease --stacktrace --no-daemon \
              || ./gradlew assembleDebug --stacktrace --no-daemon
          fi
          find . -type f -name "*.apk" | tee /tmp/apk_list.txt
          test -s /tmp/apk_list.txt || { echo "::error::Tidak ada file APK hasil build"; exit 1; }

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find "$PROJECT_ROOT" -type f -path "*/outputs/apk/release/*.apk" 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_ROOT" -type f -path "*/outputs/apk/debug/*.apk" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_ROOT" -type f -name "*.apk" 2>/dev/null | head -1 || true)
          fi
          test -n "$APK" || { echo "::error::APK tidak ditemukan"; exit 1; }
          cp "$APK" dist/app.apk
          ls -lh dist/app.apk
          echo "TAG=${{ inputs.tag }}" > dist/meta.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: dist/
          if-no-files-found: error
