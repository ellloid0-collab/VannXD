# Vann-XD — Android Native (Java/Kotlin) build
name: Build Android Native

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL ZIP project Android"
        required: true
        type: string
      tag:
        description: "Build tag"
        required: true
        type: string
      build_type:
        description: "debug | release"
        required: true
        type: string
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Android SDK cmdline-tools
        run: |
          set -euo pipefail
          ANDROID_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          # cmdline-tools resmi Google
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_ROOT/cmdline-tools"
          # struktur yang diharapkan sdkmanager: cmdline-tools/latest/
          if [ -d "$ANDROID_ROOT/cmdline-tools/cmdline-tools" ]; then
            mv "$ANDROID_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_ROOT/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" --licenses >/tmp/licenses.txt 2>&1 || true
          "$ANDROID_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_ROOT" \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "build-tools;33.0.2"
          echo "SDK ready"
          ls -la "$ANDROID_ROOT"

      - name: Download project ZIP
        env:
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -euo pipefail
          echo "Downloading project..."
          curl -fsSL -L --retry 5 --retry-delay 3 -o project.zip "$ZIP_URL"
          ls -lh project.zip
          mkdir -p work
          unzip -q project.zip -d work
          ROOT=""
          while IFS= read -r f; do
            ROOT=$(dirname "$f")
            break
          done < <(find work -maxdepth 6 \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) 2>/dev/null)
          if [ -z "$ROOT" ]; then
            while IFS= read -r f; do
              ROOT=$(dirname "$f")
              break
            done < <(find work -maxdepth 6 \( -name 'build.gradle' -o -name 'build.gradle.kts' \) 2>/dev/null)
          fi
          if [ -z "$ROOT" ]; then
            echo "::error::Tidak ditemukan settings.gradle / build.gradle"
            find work -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "Root: $ROOT"
          ls -la "$ROOT"

      - name: Prepare Gradle wrapper
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew tidak ada, install gradle & generate wrapper..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget unzip
            GRADLE_VER=8.7
            wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
            export PATH="/opt/gradle-${GRADLE_VER}/bin:$PATH"
            gradle wrapper --gradle-version "$GRADLE_VER"
            chmod +x gradlew
          fi
          test -x ./gradlew

      - name: Build APK
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT"
          TYPE="${{ inputs.build_type }}"
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/android-sdk}"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Build type: $TYPE"
          if [ "$TYPE" = "debug" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            ./gradlew assembleRelease --stacktrace --no-daemon || \
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi
          find . -type f -name "*.apk" | tee /tmp/apk_list.txt
          test -s /tmp/apk_list.txt || { echo "::error::Tidak ada APK"; exit 1; }

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find "$PROJECT_ROOT" -type f -path "*/outputs/apk/release/*.apk" 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_ROOT" -type f -path "*/outputs/apk/debug/*.apk" 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_ROOT" -type f -name "*.apk" 2>/dev/null | head -1 || true)
          fi
          test -n "$APK" || { echo "::error::APK tidak ditemukan"; exit 1; }
          cp "$APK" dist/app.apk
          ls -lh dist/app.apk
          echo "TAG=${{ inputs.tag }}" > dist/meta.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: dist/
          if-no-files-found: error
